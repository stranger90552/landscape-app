<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>iPlants圖解植栽設計 - 案例展覽館</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; 
            user-select: none; background: #f4f6f8;
        }

        /* 案例選擇層 */
        #case-selection-view {
            width: 100%; height: 100vh; box-sizing: border-box; padding: 40px 20px;
            overflow-y: auto; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .main-action-bar { position: absolute; top: 20px; right: 25px; display: flex; gap: 10px; z-index: 10; }
        .header-title { text-align: center; margin-bottom: 30px; margin-top: 10px; color: #1b5e20; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; width: 100%; margin-bottom: 40px; }
        .case-card { background: rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.08); transition: transform 0.3s; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent; position: relative; }
        .case-card:hover { transform: translateY(-8px); border-color: #4caf50; background: #ffffff; }
        .case-card-banner { width: 100%; height: 160px; position: relative; background: #a5d6a7; overflow: hidden; }
        .case-card-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .case-card-icon-badge { position: absolute; bottom: -20px; left: 20px; width: 50px; height: 50px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 2px solid #a5d6a7; }
        .case-card-body { padding: 30px 20px 20px 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .case-card h3 { font-size: 20px; color: #2e7d32; margin: 0 0 10px 0; }
        .case-card p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 15px; }
        .case-card .enter-btn { background: #2e7d32; color: white; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; width: 100%; }

        /* 圖解地圖層 */
        #garden-view { display: none; position: relative; width: 100%; height: 100vh; }
        .fullscreen-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #c8e6c9; }
        .fullscreen-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .hotspot {
            position: absolute; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.9);
            border: 2px solid #2e7d32; border-radius: 50%; cursor: move; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 2; transition: transform 0.1s ease;
        }
        .hotspot:hover { background: #e8f5e9; transform: translate(-50%, -50%) scale(1.2); }
        .hotspot.dragging { background: #fff3e0 !important; border-color: #ff9100 !important; transform: translate(-50%, -50%) scale(1.3) !important; z-index: 3; }

        .floating-action-bar { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.9); padding: 10px 18px; border-radius: 30px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; }
        .floating-action-bar h1 { margin: 0; font-size: 18px; color: #1b5e20; }
        .click-hint-banner { display: none; position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 15; background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 15px; font-weight: bold; }

        /* 側邊欄與彈窗 */
        .sidebar-card { display: none; position: absolute; top: 0; right: 0; width: 380px; height: 100vh; z-index: 20; background: rgba(255, 255, 255, 0.95); box-shadow: -5px 0 30px rgba(0,0,0,0.2); backdrop-filter: blur(10px); box-sizing: border-box; padding: 30px 25px; overflow-y: auto; }
        .center-popup-card { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 25; width: 90%; max-width: 550px; background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }

        .btn { background: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 12px; }
        .btn-back { background: #616161; }
        .btn-warning { background: #f57c00; }
        .btn-danger { background: #d32f2f; }
        .close-btn { float: right; background: #e0e0e0; color: #333; padding: 5px 12px; border-radius: 15px; font-size: 12px; border: none; cursor: pointer; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #1b5e20; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 案例選單層 -->
    <div id="case-selection-view">
        <div class="main-action-bar">
            <button class="btn" onclick="openCaseForm(-1)">➕ 新增案例</button>
        </div>
        <div class="header-title">
            <h1>🌿 iPlants 圖解植栽設計展覽館</h1>
            <p>請選擇您想要探索的案例，或利用右上角進行管理</p>
        </div>
        <div class="cards-grid" id="cases-container"></div>

        <div id="case-modal" class="center-popup-card">
            <button class="close-btn" onclick="closeOverlay('case-modal')">關閉 ❌</button>
            <h3 id="case-form-title" style="margin-top:0; color:#1b5e20;">➕ 新增案例</h3>
            <input type="hidden" id="case-edit-index" value="-1">
            <div class="form-group"><label>案例名稱：</label><input type="text" id="case-title-input"></div>
            <div class="form-group"><label>圖示 (Emoji)：</label><input type="text" id="case-icon-input" value="🏡"></div>
            <div class="form-group"><label>案例簡介：</label><textarea id="case-desc-input" rows="3"></textarea></div>
            <div class="form-group"><label>Cloudinary 背景圖片網址 (URL)：</label><input type="text" id="case-bg-input" placeholder="https://res.cloudinary.com/..."></div>
            <button class="btn" onclick="saveCase()" style="width:100%; margin-top:10px; padding:10px;">💾 儲存案例</button>
        </div>
    </div>

    <!-- 地圖檢視層 -->
    <div id="garden-view">
        <div class="floating-action-bar">
            <button class="btn btn-back" onclick="backToCaseSelection()">⬅️ 返回案例列表</button>
            <h1 id="current-case-title">🌿 我的觀察日誌</h1>
            <button class="btn" id="add-btn" onclick="startSelectLocationMode()">➕ 新增植物</button>
        </div>

        <div id="click-hint" class="click-hint-banner">📍 請在全螢幕地圖上，直接用滑鼠點選要擺放的位置...</div>

        <div class="fullscreen-bg" id="map-area">
            <img id="bg-map-img" src="" alt="花園地圖">
        </div>

        <!-- 植物詳情 -->
        <div id="detail-card" class="center-popup-card">
            <button class="close-btn" onclick="closeOverlay('detail-card')">關閉 ❌</button>
            <h2 style="margin-top:0; color:#2e7d32;"><span id="detail-icon"></span> <span id="detail-title"></span></h2>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <img id="detail-img" src="" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px;">
                <p><strong>📌 植物特徵：</strong><br><span id="detail-desc"></span></p>
                <p><strong>☀️ 照顧指南：</strong><br><span id="detail-care"></span></p>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                <button class="btn btn-warning" onclick="editCurrentPlant()">✏️ 編輯資料</button>
                <button class="btn btn-danger" onclick="deleteCurrentPlant()">🗑️ 刪除</button>
            </div>
        </div>

        <!-- 新增/編輯植物側邊欄 -->
        <div id="form-card" class="sidebar-card">
            <button class="close-btn" onclick="cancelAddMode()">取消 ❌</button>
            <h3 id="form-title" style="margin-top:0; color:#1b5e20;">🌱 填寫植物資料</h3>
            <p id="form-tip" style="font-size:12px; color:#4a148c; background:#f3e5f5; padding:8px; border-radius:6px;">✨ <b>位置已鎖定！</b>請在下方選擇與填寫資料。</p>
            
            <input type="hidden" id="edit-plant-id" value="">

            <div class="form-group"><label>植物名稱：</label><input type="text" id="new-name" placeholder="例如：龜背竹"></div>
            <div class="form-group">
                <label>地圖圖示：</label>
                <select id="new-icon">
                    <option value="🌸">🌸 小花款式</option>
                    <option value="🌿">🌿 小草款式</option>
                    <option value="🌱">🌱 小樹款式</option>
                    <option value="🌳">🌳 大樹款式</option>
                </select>
            </div>
            <div class="form-group"><label>Cloudinary 植物圖片網址 (URL)：</label><input type="text" id="new-img" placeholder="https://res.cloudinary.com/..."></div>
            <div class="form-group"><label>外部參考連結：</label><input type="url" id="new-link"></div>
            <div class="form-group"><label>外觀特徵說明：</label><textarea id="new-desc" rows="2"></textarea></div>
            <div class="form-group"><label>照顧指南：</label><textarea id="new-care" rows="2"></textarea></div>
            <div class="form-group">
                <label>相對座標 (%)：</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="new-x" readonly style="background:#eee;">
                    <input type="number" id="new-y" readonly style="background:#eee;">
                </div>
            </div>
            <button class="btn" onclick="savePlant()" style="width:100%; margin-top:10px; padding:10px;">💾 儲存植物</button>
        </div>
    </div>

<script>
    let allCases = [];
    let currentCaseIndex = null;
    let plants = [];
    let isSelectingLocation = false;
    let currentViewingIndex = null;

    function loadDataFromAPI() {
        fetch('/api/cases')
            .then(res => res.json())
            .then(res => {
                if(res.success && res.data) {
                    allCases = res.data;
                    initCaseSelection();
                }
            })
            .catch(err => console.error('無法載入資料:', err));
    }

    function initCaseSelection() {
        const container = document.getElementById('cases-container');
        container.innerHTML = '';

        allCases.forEach((c, idx) => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-card-banner">
                    <img src="${c.bgImage || ''}" alt="${c.title}">
                    <div class="case-card-icon-badge">${c.icon || "🏡"}</div>
                </div>
                <div class="case-card-body">
                    <div>
                        <div style="display:flex; justify-content:flex-end; gap:5px;">
                            <button class="btn btn-warning btn-sm" onclick="event.stopPropagation(); openCaseForm(${idx});">✏️ 編輯</button>
                            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteCase('${c.id}');">🗑️ 刪除</button>
                        </div>
                        <h3>${c.title}</h3>
                        <p>${c.desc || ''}</p>
                    </div>
                    <button class="enter-btn" onclick="openCase(${idx})">進入圖解地圖 ➔ (${c.plants ? c.plants.length : 0} 株)</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openCase(idx) {
        currentCaseIndex = idx;
        const c = allCases[idx];
        plants = c.plants || [];

        document.getElementById('current-case-title').innerText = c.title;
        document.getElementById('bg-map-img').src = c.bgImage || "";

        document.getElementById('case-selection-view').style.display = 'none';
        document.getElementById('garden-view').style.display = 'block';

        renderOverview();
    }

    function backToCaseSelection() {
        cancelAddMode();
        closeOverlay('detail-card');
        document.getElementById('garden-view').style.display = 'none';
        document.getElementById('case-selection-view').style.display = 'flex';
        loadDataFromAPI();
    }

    function renderOverview() {
        const mapArea = document.getElementById('map-area');
        const img = document.getElementById('bg-map-img');
        mapArea.innerHTML = '';
        mapArea.appendChild(img);

        img.onclick = function(e) {
            if (isSelectingLocation) {
                const percentX = Math.round((e.clientX / window.innerWidth) * 100);
                const percentY = Math.round((e.clientY / window.innerHeight) * 100);
                
                if (e.clientX < (window.innerWidth - 380)) {
                    document.getElementById('edit-plant-id').value = "";
                    document.getElementById('form-title').innerText = "🌱 填寫植物資料";
                    document.getElementById('new-x').value = percentX;
                    document.getElementById('new-y').value = percentY;
                    
                    document.getElementById('click-hint').style.display = 'none';
                    document.getElementById('form-card').style.display = 'block';
                    isSelectingLocation = false;
                }
            }
        };

        plants.forEach((p, index) => {
            const spot = document.createElement('div');
            spot.className = 'hotspot';
            spot.style.left = p.x + '%';
            spot.style.top = p.y + '%';
            spot.innerText = p.icon || "🌱"; 
            spot.title = p.name;

            let isDragging = false;

            spot.onmousedown = function(e) {
                e.stopPropagation();
                if (isSelectingLocation) return;

                let startX = e.clientX, startY = e.clientY;

                document.onmousemove = function(e) {
                    if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) {
                        isDragging = true;
                        spot.classList.add('dragging');
                        let pX = Math.max(0, Math.min(100, (e.clientX / window.innerWidth) * 100));
                        let pY = Math.max(0, Math.min(100, (e.clientY / window.innerHeight) * 100));
                        spot.style.left = pX + '%';
                        spot.style.top = pY + '%';
                    }
                };

                document.onmouseup = function(e) {
                    document.onmousemove = null;
                    document.onmouseup = null;

                    if (isDragging) {
                        isDragging = false;
                        spot.classList.remove('dragging');
                        const finalX = Math.round((e.clientX / window.innerWidth) * 100);
                        const finalY = Math.round((e.clientY / window.innerHeight) * 100);
                        
                        p.x = finalX;
                        p.y = finalY;
                        savePlantAPI(p);
                    } else {
                        showDetail(index);
                    }
                };
            };

            mapArea.appendChild(spot);
        });
    }

    function startSelectLocationMode() {
        closeOverlay('detail-card');
        closeOverlay('form-card');
        resetForm();
        isSelectingLocation = true;
        document.getElementById('click-hint').style.display = 'block';
    }

    function cancelAddMode() {
        closeOverlay('form-card');
        isSelectingLocation = false;
        document.getElementById('click-hint').style.display = 'none';
        resetForm();
    }

    function showDetail(index) {
        const p = plants[index];
        currentViewingIndex = index;
        document.getElementById('detail-icon').innerText = p.icon || "🌱"; 
        document.getElementById('detail-title').innerText = p.name;
        document.getElementById('detail-img').src = p.img || '';
        document.getElementById('detail-desc').innerText = p.desc || '';
        document.getElementById('detail-care').innerText = p.care || '';
        cancelAddMode();
        document.getElementById('detail-card').style.display = 'block';
    }

    function savePlant() {
        const name = document.getElementById('new-name').value.trim();
        if(!name) { alert('請填寫植物名稱！'); return; }

        const currentCase = allCases[currentCaseIndex];
        const plantData = {
            id: document.getElementById('edit-plant-id').value || undefined,
            case_id: currentCase.id,
            name: name,
            icon: document.getElementById('new-icon').value,
            img: document.getElementById('new-img').value.trim(),
            link: document.getElementById('new-link').value.trim(),
            desc: document.getElementById('new-desc').value.trim(),
            care: document.getElementById('new-care').value.trim(),
            x: parseFloat(document.getElementById('new-x').value) || 50,
            y: parseFloat(document.getElementById('new-y').value) || 50
        };

        savePlantAPI(plantData);
    }

    function savePlantAPI(plantData) {
        fetch('/api/plants', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer tsai66'
            },
            body: JSON.stringify(plantData)
        })
        .then(res => res.json())
        .then(res => {
            if(res.success) {
                alert('✅ 儲存植物資料成功！');
                closeOverlay('form-card');
                fetch('/api/cases')
                    .then(r => r.json())
                    .then(data => {
                        allCases = data.data;
                        plants = allCases[currentCaseIndex].plants || [];
                        renderOverview();
                    });
            } else {
                alert('儲存失敗：' + res.message);
            }
        });
    }

    function editCurrentPlant() {
        if (currentViewingIndex === null) return;
        const p = plants[currentViewingIndex];
        document.getElementById('edit-plant-id').value = p.id;
        document.getElementById('form-title').innerText = "✏️ 編輯植物資料";
        document.getElementById('new-name').value = p.name;
        document.getElementById('new-icon').value = p.icon || "🌱";
        document.getElementById('new-img').value = p.img || "";
        document.getElementById('new-link').value = p.link || "";
        document.getElementById('new-desc').value = p.desc || "";
        document.getElementById('new-care').value = p.care || "";
        document.getElementById('new-x').value = p.x;
        document.getElementById('new-y').value = p.y;

        closeOverlay('detail-card');
        document.getElementById('form-card').style.display = 'block';
    }

    function deleteCurrentPlant() {
        if (currentViewingIndex === null) return;
        const p = plants[currentViewingIndex];
        if(confirm(`確定要刪除植物『${p.name}』嗎？`)) {
            fetch(`/api/plants/${p.id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer tsai66' }
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    alert('已刪除！');
                    closeOverlay('detail-card');
                    plants.splice(currentViewingIndex, 1);
                    renderOverview();
                }
            });
        }
    }

    function openCaseForm(idx) {
        document.getElementById('case-edit-index').value = idx;
        if(idx >= 0) {
            const c = allCases[idx];
            document.getElementById('case-title-input').value = c.title;
            document.getElementById('case-icon-input').value = c.icon;
            document.getElementById('case-desc-input').value = c.desc;
            document.getElementById('case-bg-input').value = c.bgImage;
        } else {
            document.getElementById('case-title-input').value = '';
            document.getElementById('case-desc-input').value = '';
            document.getElementById('case-bg-input').value = '';
        }
        document.getElementById('case-modal').style.display = 'block';
    }

    function saveCase() {
        const title = document.getElementById('case-title-input').value.trim();
        if(!title) return alert('請輸入案例名稱');
        
        const idx = parseInt(document.getElementById('case-edit-index').value, 10);
        const caseData = {
            id: idx >= 0 ? allCases[idx].id : undefined,
            title,
            icon: document.getElementById('case-icon-input').value,
            desc: document.getElementById('case-desc-input').value,
            bgImage: document.getElementById('case-bg-input').value
        };

        fetch('/api/cases', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer tsai66'
            },
            body: JSON.stringify(caseData)
        })
        .then(res => res.json())
        .then(res => {
            if(res.success) {
                alert('✅ 儲存案例成功！');
                closeOverlay('case-modal');
                loadDataFromAPI();
            }
        });
    }

    function deleteCase(id) {
        if(confirm('確定刪除此案例？')) {
            fetch(`/api/cases/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer tsai66' }
            })
            .then(res => res.json())
            .then(() => loadDataFromAPI());
        }
    }

    function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
    function resetForm() {
        document.getElementById('edit-plant-id').value = "";
        document.getElementById('new-name').value = "";
        document.getElementById('new-img').value = "";
        document.getElementById('new-link').value = "";
        document.getElementById('new-desc').value = "";
        document.getElementById('new-care').value = "";
    }

    loadDataFromAPI();
</script>

</body>
</html>
