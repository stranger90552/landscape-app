<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>iPlants圖解植栽設計 - 案例展覽館</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; 
            user-select: none; background: #f4f6f8;
        }

        /* 1. 第一層：案例選擇頁面 */
        #case-selection-view {
            width: 100%; height: 100vh; box-sizing: border-box;
            padding: 40px 20px; overflow-y: auto;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .main-action-bar { position: absolute; top: 20px; right: 25px; display: flex; gap: 10px; z-index: 10; }
        .header-title { text-align: center; margin-bottom: 30px; margin-top: 10px; color: #1b5e20; }
        .header-title h1 { font-size: 32px; margin-bottom: 8px; }
        .header-title p { font-size: 16px; color: #388e3c; margin: 0; }

        .cards-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px; max-width: 1200px; width: 100%; margin-bottom: 40px;
        }
        .case-card {
            background: rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
            border: 2px solid transparent; position: relative;
        }
        .case-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); border-color: #4caf50; background: #ffffff; }
        .case-card-banner { width: 100%; height: 160px; position: relative; background: #a5d6a7; overflow: hidden; }
        .case-card-banner img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
        .case-card:hover .case-card-banner img { transform: scale(1.05); }
        .case-card-icon-badge {
            position: absolute; bottom: -20px; left: 20px; width: 50px; height: 50px;
            background: #ffffff; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 2px solid #a5d6a7;
        }
        .case-card-body { padding: 30px 20px 20px 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .case-card-header { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .case-card-actions { display: flex; gap: 6px; }
        .case-card h3 { font-size: 20px; color: #2e7d32; margin: 0 0 10px 0; }
        .case-card p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 15px; flex-grow: 1; }
        .case-card .enter-btn {
            background: #2e7d32; color: white; padding: 10px 16px; border-radius: 20px;
            font-size: 14px; font-weight: bold; text-align: center; border: none; cursor: pointer; transition: background 0.2s; width: 100%;
        }
        .case-card .enter-btn:hover { background: #1b5e20; }

        /* 2. 第二層：地圖圖解視圖 */
        #garden-view { display: none; position: relative; width: 100%; height: 100vh; }
        .fullscreen-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #c8e6c9; }
        .fullscreen-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .hotspot {
            position: absolute; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.9);
            border: 2px solid #2e7d32; border-radius: 50%; cursor: move; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); transition: transform 0.1s ease, background 0.2s ease; z-index: 2;
        }
        .hotspot:hover { background: #e8f5e9; transform: translate(-50%, -50%) scale(1.2); }
        .hotspot.dragging { background: #fff3e0 !important; border-color: #ff9100 !important; transform: translate(-50%, -50%) scale(1.3) !important; z-index: 3; }

        .floating-action-bar {
            position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.9);
            padding: 10px 18px; border-radius: 30px; backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px;
        }
        .floating-action-bar h1 { margin: 0; font-size: 18px; color: #1b5e20; }
        .click-hint-banner {
            display: none; position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 15;
            background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 24px; border-radius: 20px;
            font-size: 15px; font-weight: bold; animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

        .sidebar-card {
            display: none; position: absolute; top: 0; right: 0; width: 380px; height: 100vh; z-index: 20;
            background: rgba(255, 255, 255, 0.95); box-shadow: -5px 0 30px rgba(0,0,0,0.2); backdrop-filter: blur(10px);
            box-sizing: border-box; padding: 30px 25px; overflow-y: auto;
        }
        .center-popup-card {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 25;
            width: 90%; max-width: 550px; background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }

        .detail-content { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .detail-image-link { display: block; text-decoration: none; overflow: hidden; border-radius: 8px; }
        .detail-image-link img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; }
        .popup-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }

        .btn { background: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn:hover { background: #1b5e20; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 12px; }
        .btn-back { background: #616161; }
        .btn-warning { background: #f57c00; }
        .btn-danger { background: #d32f2f; }
        .close-btn { float: right; background: #e0e0e0; color: #333; padding: 5px 12px; border-radius: 15px; font-size: 12px; border: none; cursor: pointer; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #1b5e20; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 1. 第一層：案例選擇頁面 -->
    <div id="case-selection-view">
        <div class="main-action-bar">
            <button class="btn" onclick="openCaseForm(null)">➕ 新增案例</button>
        </div>

        <div class="header-title">
            <h1>🌿 iPlants 圖解植栽設計展覽館</h1>
            <p>請選擇您想要探索的案例，或利用右上角進行管理</p>
        </div>

        <div class="cards-grid" id="cases-container"></div>

        <!-- 案例新增/編輯彈窗 -->
        <div id="case-modal" class="center-popup-card">
            <button class="close-btn" onclick="closeOverlay('case-modal')">關閉 ❌</button>
            <h3 id="case-form-title" style="margin-top: 0; color: #1b5e20; border-bottom: 2px solid #2e7d32; padding-bottom: 8px;">➕ 新增案例</h3>
            <input type="hidden" id="case-edit-id" value="">

            <div class="form-group">
                <label>案例名稱：</label>
                <input type="text" id="case-title-input" placeholder="例如：北歐風陽台景觀">
            </div>
            <div class="form-group">
                <label>圖示 (Emoji)：</label>
                <input type="text" id="case-icon-input" placeholder="例如：🏡, 🌿, 🌵">
            </div>
            <div class="form-group">
                <label>案例簡介：</label>
                <textarea id="case-desc-input" rows="3" placeholder="簡短描述這個案例的風格..."></textarea>
            </div>
            <div class="form-group">
                <label>背景地圖圖檔網址 (URL)：</label>
                <input type="text" id="case-bg-input" placeholder="https://images.unsplash.com/...">
            </div>

            <button class="btn" onclick="saveCase()" style="width: 100%; margin-top: 10px; padding: 10px;">💾 儲存案例</button>
        </div>
    </div>

    <!-- 2. 第二層：案例地圖視圖 -->
    <div id="garden-view">
        <div class="floating-action-bar">
            <button class="btn btn-back" onclick="backToCaseSelection()">⬅️ 返回案例列表</button>
            <h1 id="current-case-title">🌿 我的觀察日誌</h1>
            <button class="btn" id="add-btn" onclick="startSelectLocationMode()">➕ 新增植物</button>
        </div>

        <div id="click-hint" class="click-hint-banner">📍 請在全螢幕地圖上，直接用滑鼠點選要擺放的位置...</div>

        <div class="fullscreen-bg" id="map-area">
            <img id="bg-map-img" src="" alt="花園全螢幕總覽圖" onerror="this.style.display='none';">
        </div>

        <!-- 植物詳細資料彈窗 -->
        <div id="detail-card" class="center-popup-card">
            <button class="close-btn" onclick="closeOverlay('detail-card')">關閉 ❌</button>
            <h2 style="margin-top: 0; color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 5px;">
                <span id="detail-icon"></span><span id="detail-title">植物名稱</span>
            </h2>
            <div class="detail-content">
                <a id="detail-link" href="#" target="_blank" class="detail-image-link">
                    <img id="detail-img" src="" alt="植物照片">
                </a>
                <div class="detail-info">
                    <p><strong>📌 植物特徵：</strong><br><span id="detail-desc">說明...</span></p>
                    <p><strong>☀️ 照顧指南：</strong><br><span id="detail-care">指南...</span></p>
                </div>
            </div>
            <div class="popup-footer">
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-warning" onclick="editCurrentPlant()">✏️ 編輯資料</button>
                    <button class="btn btn-danger" onclick="deleteCurrentPlant()">🗑️ 刪除</button>
                </div>
                <span style="font-size: 11px; color: #999;">管理員專用功能</span>
            </div>
        </div>

        <!-- 植物新增/編輯側邊欄表單 -->
        <div id="form-card" class="sidebar-card">
            <button class="close-btn" onclick="cancelAddMode()">取消 ❌</button>
            <h3 id="form-title" style="margin-top: 0; color: #1b5e20; border-bottom: 2px solid #2e7d32; padding-bottom: 8px;">🌱 填寫植物資料</h3>
            
            <input type="hidden" id="edit-plant-id" value="">

            <div class="form-group">
                <label>植物名稱：</label>
                <input type="text" id="new-name" placeholder="例如：琴葉榕">
            </div>
            <div class="form-group">
                <label>縮圖樣式 (Emoji)：</label>
                <select id="new-icon">
                    <option value="🌸">🌸 小花款式</option>
                    <option value="🌿">🌿 小草款式</option>
                    <option value="🌱">🌱 小樹款式</option>
                    <option value="🌳">🌳 大樹款式</option>
                </select>
            </div>
            <div class="form-group">
                <label>植物圖片網址 (URL)：</label>
                <input type="text" id="new-img" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
                <label>外部參考連結：</label>
                <input type="url" id="new-link" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>外觀特徵說明：</label>
                <textarea id="new-desc" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>照顧與環境需求：</label>
                <textarea id="new-care" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>相對座標 (%)：</label>
                <div style="display: flex; gap: 15px;">
                    <input type="number" id="new-x" min="0" max="100" readonly style="background:#eee;">
                    <input type="number" id="new-y" min="0" max="100" readonly style="background:#eee;">
                </div>
            </div>
            <button class="btn" onclick="savePlant()" style="width: 100%; margin-top: 10px; padding: 10px;">💾 儲存資料</button>
        </div>
    </div>

<script>
    let allCases = [];
    let currentCase = null;
    let currentViewingPlant = null;
    let isSelectingLocation = false;

    // 初始化：獲取 API 所有案例
    async function initCaseSelection() {
        try {
            const res = await fetch('/api/cases');
            const data = await res.json();
            if (data.success) {
                allCases = data.data;
                renderCases();
            }
        } catch (err) {
            console.error("無法載入 API 資料:", err);
        }
    }

    function renderCases() {
        const container = document.getElementById('cases-container');
        container.innerHTML = '';
        allCases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            const bgUrl = c.bgImage || 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=1200';
            card.innerHTML = `
                <div class="case-card-banner">
                    <img src="${bgUrl}" alt="${c.title}">
                    <div class="case-card-icon-badge">${c.icon || "🏡"}</div>
                </div>
                <div class="case-card-body">
                    <div>
                        <div class="case-card-header">
                            <div class="case-card-actions">
                                <button class="btn btn-warning btn-sm" onclick="event.stopPropagation(); openCaseForm('${c.id}');">✏️ 編輯</button>
                                <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteCase('${c.id}');">🗑️ 刪除</button>
                            </div>
                        </div>
                        <h3>${c.title}</h3>
                        <p>${c.desc || ''}</p>
                    </div>
                    <button class="enter-btn" onclick="openCase('${c.id}')">進入圖解地圖 ➔ (${c.plants ? c.plants.length : 0} 株植物)</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function saveCase() {
        const password = prompt("請輸入管理員密碼：");
        if (!password) return;

        const id = document.getElementById('case-edit-id').value;
        const title = document.getElementById('case-title-input').value.trim();
        const icon = document.getElementById('case-icon-input').value.trim() || '🏡';
        const desc = document.getElementById('case-desc-input').value.trim();
        const bgImage = document.getElementById('case-bg-input').value.trim();

        if (!title) return alert('請輸入名稱！');

        const res = await fetch('/api/cases', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${password}` },
            body: JSON.stringify({ id, title, icon, desc, bgImage })
        });
        const result = await res.json();
        if (result.success) {
            alert('✅ 儲存成功！');
            closeOverlay('case-modal');
            initCaseSelection();
        } else {
            alert(result.message || '儲存失敗！');
        }
    }

    async function deleteCase(id) {
        if (!confirm('確定要刪除此案例嗎？')) return;
        const password = prompt("請輸入管理員密碼：");
        if (!password) return;

        const res = await fetch(`/api/cases/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${password}` }
        });
        const result = await res.json();
        if (result.success) {
            initCaseSelection();
        } else {
            alert(result.message || '刪除失敗！');
        }
    }

    function openCaseForm(id) {
        document.getElementById('case-edit-id').value = id || '';
        if (id) {
            const c = allCases.find(x => x.id === id);
            document.getElementById('case-title-input').value = c.title;
            document.getElementById('case-icon-input').value = c.icon;
            document.getElementById('case-desc-input').value = c.desc;
            document.getElementById('case-bg-input').value = c.bgImage;
        } else {
            document.getElementById('case-title-input').value = '';
            document.getElementById('case-icon-input').value = '🏡';
            document.getElementById('case-desc-input').value = '';
            document.getElementById('case-bg-input').value = '';
        }
        document.getElementById('case-modal').style.display = 'block';
    }

    function openCase(id) {
        currentCase = allCases.find(c => c.id === id);
        document.getElementById('current-case-title').innerText = currentCase.title;
        document.getElementById('bg-map-img').src = currentCase.bgImage || 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=1200';
        document.getElementById('case-selection-view').style.display = 'none';
        document.getElementById('garden-view').style.display = 'block';
        renderOverview();
    }

    function backToCaseSelection() {
        document.getElementById('garden-view').style.display = 'none';
        document.getElementById('case-selection-view').style.display = 'flex';
        initCaseSelection();
    }

    function renderOverview() {
        const mapArea = document.getElementById('map-area');
        const img = document.getElementById('bg-map-img');
        mapArea.innerHTML = '';
        mapArea.appendChild(img);

        img.onclick = function(e) {
            if (isSelectingLocation) {
                const percentX = Math.round((e.clientX / window.innerWidth) * 100);
                const percentY = Math.round((e.clientY / window.innerHeight) * 100);
                document.getElementById('edit-plant-id').value = "";
                document.getElementById('new-x').value = percentX;
                document.getElementById('new-y').value = percentY;
                document.getElementById('click-hint').style.display = 'none';
                document.getElementById('form-card').style.display = 'block';
                isSelectingLocation = false;
            }
        };

        (currentCase.plants || []).forEach(p => {
            const spot = document.createElement('div');
            spot.className = 'hotspot';
            spot.style.left = p.x + '%';
            spot.style.top = p.y + '%';
            spot.innerText = p.icon || "🌱";
            spot.onclick = (e) => { e.stopPropagation(); showDetail(p); };
            mapArea.appendChild(spot);
        });
    }

    function showDetail(p) {
        currentViewingPlant = p;
        document.getElementById('detail-icon').innerText = p.icon || "🌱";
        document.getElementById('detail-title').innerText = p.name;
        document.getElementById('detail-img').src = p.img || '';
        document.getElementById('detail-desc').innerText = p.desc || '';
        document.getElementById('detail-care').innerText = p.care || '';
        document.getElementById('detail-card').style.display = 'block';
    }

    function editCurrentPlant() {
        if (!currentViewingPlant) return;
        const p = currentViewingPlant;
        document.getElementById('edit-plant-id').value = p.id;
        document.getElementById('new-name').value = p.name;
        document.getElementById('new-icon').value = p.icon || "🌱";
        document.getElementById('new-img').value = p.img || "";
        document.getElementById('new-link').value = p.link || "";
        document.getElementById('new-desc').value = p.desc || "";
        document.getElementById('new-care').value = p.care || "";
        document.getElementById('new-x').value = p.x;
        document.getElementById('new-y').value = p.y;
        closeOverlay('detail-card');
        document.getElementById('form-card').style.display = 'block';
    }

    async function savePlant() {
        const password = prompt("請輸入管理員密碼：");
        if (!password) return;

        const id = document.getElementById('edit-plant-id').value;
        const name = document.getElementById('new-name').value.trim();
        const icon = document.getElementById('new-icon').value;
        const img = document.getElementById('new-img').value.trim();
        const link = document.getElementById('new-link').value.trim();
        const desc = document.getElementById('new-desc').value.trim();
        const care = document.getElementById('new-care').value.trim();
        const x = parseFloat(document.getElementById('new-x').value);
        const y = parseFloat(document.getElementById('new-y').value);

        if (!name) return alert('請填寫名稱');

        const res = await fetch('/api/plants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${password}` },
            body: JSON.stringify({ id, case_id: currentCase.id, name, icon, img, link, desc, care, x, y })
        });
        const result = await res.json();
        if (result.success) {
            closeOverlay('form-card');
            const resCases = await fetch('/api/cases');
            const data = await resCases.json();
            allCases = data.data;
            openCase(currentCase.id);
        } else {
            alert(result.message || '儲存失敗！');
        }
    }

    async function deleteCurrentPlant() {
        if (!confirm('確定刪除此植物嗎？')) return;
        const password = prompt("請輸入管理員密碼：");
        if (!password) return;

        const res = await fetch(`/api/plants/${currentViewingPlant.id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${password}` }
        });
        const result = await res.json();
        if (result.success) {
            closeOverlay('detail-card');
            const resCases = await fetch('/api/cases');
            const data = await resCases.json();
            allCases = data.data;
            openCase(currentCase.id);
        }
    }

    function startSelectLocationMode() {
        closeOverlay('detail-card');
        isSelectingLocation = true;
        document.getElementById('click-hint').style.display = 'block';
    }

    function cancelAddMode() {
        closeOverlay('form-card');
        isSelectingLocation = false;
        document.getElementById('click-hint').style.display = 'none';
    }

    function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }

    initCaseSelection();
</script>
</body>
</html>
